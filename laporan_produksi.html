            </div>

            <div className="overflow-x-auto">
              <table className="w-full text-left border-collapse text-[12px] whitespace-nowrap">
                <thead>
                  <tr className="bg-slate-100 dark:bg-[#1E1E1E] border-b border-slate-200 dark:border-slate-700 text-slate-500 font-semibold text-center uppercase tracking-wider">
                    <th className="px-4 py-3 w-12 text-center">No</th>
                    <th className="px-4 py-3 text-left">Nama Regional</th>
                    <th className="px-4 py-3 text-right">Realisasi AGRI-PAM (Ton)</th>
                    <th className="px-4 py-3 text-right">Realisasi PalmOps (Ton)</th>
                    <th className="px-4 py-3 text-right">Selisih (Ton)</th>
                    <th className="px-4 py-3 text-right">Persentase</th>
                    <th className="px-4 py-3 w-32 text-center">Status</th>
                  </tr>
                </thead>
                <tbody className="divide-y divide-slate-150 dark:divide-slate-750">
                  {filteredList.map((row, idx) => {
                    const hasDiff = row.status === 'MISMATCH';
                    const isMatched = row.status === 'MATCH';

                    let statusBadge = (
                      <span className="text-[10px] bg-slate-100 dark:bg-slate-700 text-slate-500 dark:text-slate-400 font-bold px-2 py-0.5 rounded-full uppercase">Belum Ada Data</span>
                    );
                    if (isMatched) {
                      statusBadge = (
                        <span className="text-[10px] bg-green-500 text-white font-bold px-2.5 py-0.5 rounded-full uppercase flex items-center justify-center gap-1 w-fit mx-auto shadow-sm">

                    } else if (hasDiff) {
                      statusBadge = (
                        <span className="text-[10px] bg-red-500 text-white font-bold px-2.5 py-0.5 rounded-full uppercase flex items-center justify-center gap-1 w-fit mx-auto shadow-sm animate-pulse">
                          <Icon name="x" size={10} /> Selisih
                        </span>

                    }

                    return (
                      <tr
                        key={row.region}
                        className={`hover:bg-slate-50/50 dark:hover:bg-slate-800/50 transition-colors ${hasDiff ? 'bg-red-500/5 dark:bg-red-950/10' : ''
                          }`}
                      >
                        <td className="px-4 py-2.5 text-center font-medium text-slate-400">{idx + 1}</td>
                        <td className="px-4 py-2.5 font-bold text-slate-700 dark:text-slate-200 text-left">{row.region}</td>
                        <td className="px-4 py-2.5 text-right font-semibold tabular-nums text-slate-800 dark:text-white">{formatRibuan(row.agripam)}</td>
                        <td className="px-4 py-2.5 text-right font-semibold tabular-nums text-slate-850 dark:text-slate-100">{activePalmopsSource ? formatRibuan(row.palmops) : "-"}</td>
                        <td className={`px-4 py-2.5 text-right font-bold tabular-nums ${hasDiff ? 'text-red-600 dark:text-red-400' : 'text-green-600'}`}>
                          {activePalmopsSource ? (row.selisih > 0 ? `+${formatRibuan(row.selisih)}` : formatRibuan(row.selisih)) : "-"}
                        </td>
                        <td className="px-4 py-2.5 text-right font-semibold tabular-nums text-slate-800 dark:text-white">
                          {activePalmopsSource && row.palmops > 0 ? ((row.selisih / row.palmops) * 100).toLocaleString('id-ID', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + "%" : "-"}
                        </td>
                        <td className="px-4 py-2.5 text-center">{statusBadge}</td>

                  })}

                  <tr className="bg-slate-100 dark:bg-[#1E1E1E] border-t border-slate-200 dark:border-slate-700 font-bold">
                    <td colSpan={2} className="px-4 py-3 text-center text-[13px] text-slate-700 dark:text-white uppercase tracking-wider">Total Nasional</td>
                    <td className="px-4 py-3 text-right text-[13px] tabular-nums text-slate-800 dark:text-white">{formatRibuan(totalAgripam)}</td>
                    <td className="px-4 py-3 text-right text-[13px] tabular-nums text-slate-850 dark:text-slate-100">{activePalmopsSource ? formatRibuan(totalPalmops) : "-"}</td>
                    <td className={`px-4 py-3 text-right text-[13px] tabular-nums ${activePalmopsSource && Math.abs(totalSelisih) >= 0.1 ? 'text-red-600 dark:text-red-400' : 'text-green-600'}`}>
                      {activePalmopsSource ? (totalSelisih > 0 ? `+${formatRibuan(totalSelisih)}` : formatRibuan(totalSelisih)) : "-"}

                      {activePalmopsSource && totalPalmops > 0 ? ((totalSelisih / totalPalmops) * 100).toLocaleString('id-ID', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + "%" : "-"}

    // ============================================================
    // TARGET CHALLENGE MODAL COMPONENT
    // ============================================================
    function TargetChallengeModal({ isOpen, onClose }) {
      const [selectedMonth, setSelectedMonth] = useState(new Date().toISOString().slice(0, 7)); // YYYY-MM
      const [targetData, setTargetData] = useState(null);
      const [loading, setLoading] = useState(false);
      const [uploading, setUploading] = useState(false);
      const fileInputRef = useRef(null);

      const fetchTarget = async () => {
        setLoading(true);
        try {
          const sessionRaw = sessionStorage.getItem("agripam_session");
          const session = sessionRaw ? JSON.parse(sessionRaw) : null;
          const token = session ? session.token : "";
          const res = await fetch(`/api/targetChallenge?action=getTarget&bulan=${selectedMonth}&token=${token}&_t=${Date.now()}`);
          const json = await res.json();
          if (json.success && json.exists) {
            setTargetData(json.data);
          } else {
            setTargetData(null);
          }
        } catch (err) {
          console.error("Gagal fetch target:", err);
          setTargetData(null);
        } finally {
          setLoading(false);
        }
      };

      useEffect(() => {
        if (isOpen) {
          fetchTarget();
        }
      }, [isOpen, selectedMonth]);

      const handleFile = (file) => {
        if (!file) return;
        setUploading(true);
        const reader = new FileReader();
        reader.onload = async (e) => {
          try {
            const data = new Uint8Array(e.target.result);
            const workbook = XLSX.read(data, { type: 'array' });
            const sheet = workbook.Sheets[workbook.SheetNames[0]];
            const rows = XLSX.utils.sheet_to_json(sheet, { header: 1 });

            if (!rows || rows.length < 2) {
              alert("File target kosong atau tidak valid.");
              return;
            }

            // Deteksi format header (Baris 0)
            const header = rows[0] ? rows[0].map(c => String(c || '').trim()) : [];
            let regionColIdx = 0;
            let dateColStart = 1;

            // Jika header mengandung "CRO" di kolom 0 atau "Regional" di kolom 1, gunakan format baru
            const isNewFormat = (header[0] && header[0].toLowerCase().includes('cro')) ||
              (header[1] && header[1].toLowerCase() === 'regional');

            if (isNewFormat) {
              regionColIdx = 1; // Kolom Regional (nama wilayah)
              dateColStart = 2; // Tanggal mulai dari kolom Tgl 1 (index 2)
            }

            const parsedData = {};
            for (let i = 1; i < rows.length; i++) {
              const row = rows[i];
              if (!row) continue;
              const rawRegion = row[regionColIdx];
              if (rawRegion === undefined || rawRegion === null) continue;

              const regionName = String(rawRegion).trim();

              // Abaikan header, baris kosong, subtotal, dan total
              if (!regionName ||
                regionName.toLowerCase().startsWith('subtotal') ||
                regionName.toLowerCase().includes('total target') ||
                regionName.toLowerCase() === 'regional' ||
                regionName.toLowerCase() === 'wilayah' ||
                regionName.toLowerCase().includes('cro / wilayah')) {
                continue;
              }

              const dates = {};
              for (let d = 1; d <= 31; d++) {
                const colIdx = dateColStart + (d - 1);
                dates[d] = parseFloat(row[colIdx]) || 0;
              }

              // Jika format lama mengandung "Kalbar 1", petakan ke Kalbar 1A & Kalbar 1B
              if (regionName === "Kalbar 1") {
                parsedData["Kalbar 1A"] = dates;
                parsedData["Kalbar 1B"] = dates;
              } else {
                parsedData[regionName] = dates;
              }
            }

            if (Object.keys(parsedData).length === 0) {
              alert("Tidak ada data target wilayah yang valid berhasil dibaca dari file.");
              return;
            }

            setTargetData(parsedData);
          } catch (err) {
            alert("Gagal memparsing file target: " + err.message);
          } finally {
            setUploading(false);
          }
        };
        reader.readAsArrayBuffer(file);
      };

      const saveToDb = async () => {
        if (!targetData) return;
        setUploading(true);
        try {
          const sessionRaw = sessionStorage.getItem("agripam_session");
          const session = sessionRaw ? JSON.parse(sessionRaw) : null;
          const token = session ? session.token : "";
          const res = await fetch('/api/targetChallenge', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              action: 'saveTarget',
              bulan: selectedMonth,
              token: token,
              region: 'ADMIN',
              data: targetData
            })
          });
          const json = await res.json();
          if (json.success) {
            alert("Berhasil menyimpan target bulanan!");
            fetchTarget();
            onClose(); // Menutup otomatis setelah sukses
          } else {
            alert(json.message || "Gagal menyimpan.");
          }
        } catch (err) {
          alert("Error: " + err.message);
        } finally {
          setUploading(false);
        }
      };

      const deleteFromDb = async () => {
        if (!confirm(`Hapus data target untuk bulan ${selectedMonth}?`)) return;
        setUploading(true);
        try {
          const sessionRaw = sessionStorage.getItem("agripam_session");
          const session = sessionRaw ? JSON.parse(sessionRaw) : null;
          const token = session ? session.token : "";
          const res = await fetch('/api/targetChallenge', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              action: 'deleteTarget',
              bulan: selectedMonth,
              token: token,
              region: 'ADMIN'
            })
          });
          const json = await res.json();
          if (json.success) {
            alert("Berhasil menghapus target bulanan!");
            setTargetData(null);
          } else {
            alert(json.message || "Gagal menghapus.");
          }
        } catch (err) {
          alert("Error: " + err.message);
        } finally {
          setUploading(false);
        }
      };

      if (!isOpen) return null;

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/50 backdrop-blur-sm p-4">
          <div className="bg-white dark:bg-[#1E1E1E] rounded-xl shadow-2xl w-full max-w-4xl max-h-[90vh] flex flex-col overflow-hidden animate-fadeIn">
            {/* Header */}
            <div className="flex items-center justify-between p-5 border-b border-slate-200 dark:border-slate-800 bg-slate-50 dark:bg-[#1E1E1E]/50">
              <h2 className="text-lg font-bold text-slate-800 dark:text-slate-100 flex items-center gap-2">
                <Icon name="target" size={20} className="text-brand-600" />
                Kelola Target Challenge Bulanan
              </h2>
              <button onClick={onClose} className="text-slate-400 hover:text-slate-600 dark:hover:text-slate-200">
                <Icon name="x" size={20} />
              </button>
            </div>

            {/* Content */}
            <div className="flex-1 overflow-auto p-6 flex flex-col gap-6">

              <div className="flex items-center gap-4">
                <div className="flex flex-col">
                  <label className="text-xs font-bold text-slate-500 uppercase mb-1">Bulan & Tahun</label>
                  <input type="month" value={selectedMonth} onChange={e => setSelectedMonth(e.target.value)} className="border border-slate-300 dark:border-slate-700 rounded-lg p-2 text-sm font-medium focus:ring-2 focus:ring-brand-500 outline-none dark:bg-[#1E1E1E] dark:text-white" />
                </div>

                {targetData && (
                  <div className="flex gap-2 mt-5">
                    <button onClick={saveToDb} disabled={uploading} className="bg-brand-600 hover:bg-brand-700 text-white px-4 py-2 rounded-lg text-sm font-semibold flex items-center gap-2 transition-colors disabled:opacity-50">
                      <Icon name="save" size={16} /> Simpan ke Database
                    </button>
                    <button onClick={deleteFromDb} disabled={uploading} className="bg-red-600 hover:bg-red-700 text-white px-4 py-2 rounded-lg text-sm font-semibold flex items-center gap-2 transition-colors disabled:opacity-50">
                      <Icon name="trash-2" size={16} /> Hapus Data Bulan Ini
                    </button>
                  </div>
                )}
              </div>

              {!targetData && (
                <div
                  onClick={() => fileInputRef.current?.click()}
                  className="border-2 border-dashed border-slate-300 dark:border-slate-700 rounded-xl p-10 text-center cursor-pointer hover:border-brand-500 hover:bg-slate-50 dark:hover:bg-slate-800/50 transition-colors"
                >
                  <input ref={fileInputRef} type="file" accept=".xlsx,.xls,.csv" className="hidden" onChange={e => handleFile(e.target.files[0])} />
                  <div className="w-16 h-16 rounded-full bg-brand-50 dark:bg-brand-900/30 flex items-center justify-center text-brand-600 mx-auto mb-4">
                    <Icon name="upload-cloud" size={32} />
                  </div>
                  <h3 className="text-sm font-bold text-slate-700 dark:text-slate-200 mb-1">Unggah Target Bulanan (.csv / .xlsx)</h3>
                  <p className="text-xs text-slate-500">Mendukung format baru (CRO, Regional, Tgl 1-31) & format lama (.csv atau .xlsx)</p>
                </div>
              )}

              {loading ? (
                <div className="flex justify-center p-10"><div className="w-8 h-8 border-4 border-brand-200 border-t-brand-600 rounded-full animate-spin"></div></div>
              ) : targetData ? (
                <div className="flex flex-col gap-4">
                  <div className="overflow-x-auto border border-slate-200 dark:border-slate-700 rounded-lg">
                    <table className="w-full text-xs text-left">
                      <thead className="bg-slate-50 dark:bg-[#1E1E1E] text-slate-600 dark:text-slate-300 uppercase">
                        <tr>
                          <th className="px-3 py-2 border-b dark:border-slate-700 whitespace-nowrap min-w-[120px]">Wilayah</th>
                          {Array.from({ length: 31 }, (_, i) => i + 1).map(d => (
                            <th key={d} className="px-2 py-2 border-b dark:border-slate-700 text-center">Tgl {d}</th>
                          ))}
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-slate-200 dark:divide-slate-700">
                        {Object.keys(targetData).map(region => (
                          <tr key={region} className="hover:bg-slate-50 dark:hover:bg-slate-800/50">
                            <td className="px-3 py-2 font-medium">{region}</td>
                            {Array.from({ length: 31 }, (_, i) => i + 1).map(d => (
                              <td key={d} className="px-2 py-2 text-center text-slate-600 dark:text-slate-400">{targetData[region][d] || 0}</td>
                            ))}
                          </tr>
                        ))}
                      </tbody>

    function RencanaRealisasiPanel() {
      const [selectedDate, setSelectedDate] = useState(getTodayWIB());
      const [dbEstimasi, setDbEstimasi] = useState({});
      const [regionTotals, setRegionTotals] = useState(null);
      const [loading, setLoading] = useState(false);
      const [fileName, setFileName] = useState("");
      const [dragActive, setDragActive] = useState(false);
      const [customRemarks, setCustomRemarks] = useState({});
      const [isDataSaved, setIsDataSaved] = useState(false);
      const [isSaving, setIsSaving] = useState(false);
      const [isTargetModalOpen, setIsTargetModalOpen] = useState(false);
      const [targetChallengeData, setTargetChallengeData] = useState({});
      const fileInputRef = useRef(null);

      const fetchTargetChallenge = async (dateStr) => {
        if (!dateStr) return;
        const [year, month, day] = dateStr.split('-');
        const bulan = `${year}-${month}`;
        const dayInt = parseInt(day, 10);

        try {
          const sessionRaw = sessionStorage.getItem("agripam_session");
          const session = sessionRaw ? JSON.parse(sessionRaw) : null;
          const token = session ? session.token : "";
          const res = await fetch(`/api/targetChallenge?action=getTarget&bulan=${bulan}&token=${token}&_t=${Date.now()}`);
          const json = await res.json();
          if (json.success && json.exists) {
            const todayTargets = {};
            for (const [region, days] of Object.entries(json.data)) {
              todayTargets[region] = days[dayInt] || 0;
            }
            setTargetChallengeData(todayTargets);
          } else {
            setTargetChallengeData({});
          }
        } catch (e) {
          console.error("Gagal fetch target challenge", e);
        }
      };

      const normalizeEstimasiData = (rawEstimasi) => {
        if (!rawEstimasi) return {};
        const normalized = {};
        for (const key in rawEstimasi) {
          const matched = findRegionMatch(key) || key;
          normalized[matched] = rawEstimasi[key];
        }
        return normalized;
      };

      // Fetch estimasi data when date changes (Fallback jika data belum tersimpan)
      const fetchEstimasi = async (date) => {
        setLoading(true);
        try {
          const sessionRaw = sessionStorage.getItem("agripam_session");
          const session = sessionRaw ? JSON.parse(sessionRaw) : null;
          const token = session ? session.token : "";
          const res = await fetch(`/api/estimasi?action=getEstimasi&tanggal=${date}&region=ALL&token=${token}&_t=${Date.now()}`);
          const json = await res.json();
          if (json.success) {
            setDbEstimasi(normalizeEstimasiData(json.allEstimasi || {}));
          } else {
            setDbEstimasi({});
          }
        } catch (e) {
          console.error("Gagal mengambil estimasi:", e);
          setDbEstimasi({});
        } finally {
          setLoading(false);
        }
      };

      const checkSavedLaporan = async (date) => {
        setLoading(true);
        try {
          const sessionRaw = sessionStorage.getItem("agripam_session");
          const session = sessionRaw ? JSON.parse(sessionRaw) : null;
          const token = session ? session.token : "";
          const res = await fetch(`/api/laporanRealisasi?action=getLaporan&tanggal=${date}&token=${token}&_t=${Date.now()}`);
          const json = await res.json();

          if (json.success && json.exists && json.data) {
            setRegionTotals(json.data.regionTotals);
            setCustomRemarks(json.data.customRemarks || {});
            setDbEstimasi(normalizeEstimasiData(json.data.dbEstimasi || {}));
            setIsDataSaved(true);
            setFileName("Data dimuat dari Database");
          } else {
            setIsDataSaved(false);
            setRegionTotals(null);
            setCustomRemarks({});
            setFileName("");
            await fetchEstimasi(date);
          }
        } catch (e) {
          console.error("Gagal mengecek laporan:", e);
          setIsDataSaved(false);
          await fetchEstimasi(date);
        } finally {
          setLoading(false);
        }
      };

      const saveLaporan = async () => {
        if (!regionTotals) {
          alert("Belum ada data untuk disimpan.");
          return;
        }
        setIsSaving(true);
        try {
          const sessionRaw = sessionStorage.getItem("agripam_session");
          const session = sessionRaw ? JSON.parse(sessionRaw) : null;
          const token = session ? session.token : "";

          const payloadData = {
            regionTotals,
            customRemarks,
            dbEstimasi
          };

          const res = await fetch(`/api/laporanRealisasi?_t=${Date.now()}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              action: 'saveLaporan',
              tanggal: selectedDate,
              token: token,
              region: 'ADMIN',
              data: payloadData
            })
          });
          const json = await res.json();
          if (json.success) {
            alert("Laporan berhasil disimpan ke database!");
            setIsDataSaved(true);
            setFileName("Data dimuat dari Database");
          } else {
            alert(json.message || "Gagal menyimpan laporan.");
          }
        } catch (e) {
          console.error("Error saving laporan:", e);
          alert("Terjadi kesalahan saat menyimpan laporan.");
        } finally {
          setIsSaving(false);
        }
      };

      const deleteLaporan = async () => {
        const confirmed = await window.showConfirm("Konfirmasi Hapus", "Apakah Anda yakin ingin menghapus data laporan untuk tanggal ini?\nAnda harus mengunggah ulang file LHP jika ingin menampilkan datanya lagi.");
        if (!confirmed) return;
        setIsSaving(true);
        try {
          const sessionRaw = sessionStorage.getItem("agripam_session");
          const session = sessionRaw ? JSON.parse(sessionRaw) : null;
          const token = session ? session.token : "";

          const res = await fetch(`/api/laporanRealisasi?_t=${Date.now()}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              action: 'deleteLaporan',
              tanggal: selectedDate,
              token: token,
              region: 'ADMIN'
            })
          });
          const json = await res.json();
          if (json.success) {
            alert("Laporan berhasil dihapus.");
            setIsDataSaved(false);
            setRegionTotals(null);
            setCustomRemarks({});
            setFileName("");
            await fetchEstimasi(selectedDate);
          } else {
            alert(json.message || "Gagal menghapus laporan.");
          }
        } catch (e) {
          console.error("Error deleting laporan:", e);
          alert("Terjadi kesalahan saat menghapus laporan.");
        } finally {
          setIsSaving(false);
        }
      };

      useEffect(() => {
        checkSavedLaporan(selectedDate);
        fetchTargetChallenge(selectedDate);
      }, [selectedDate]);

      const handleDrag = (e) => {
        e.preventDefault();
        e.stopPropagation();
        if (e.type === "dragenter" || e.type === "dragover") {
          setDragActive(true);
        } else if (e.type === "dragleave") {
          setDragActive(false);
        }
      };

      const handleDrop = (e) => {
        e.preventDefault();
        e.stopPropagation();
        setDragActive(false);
        if (e.dataTransfer.files && e.dataTransfer.files[0]) {
          handleFile(e.dataTransfer.files[0]);
        }
      };

      const handleFileInputChange = (e) => {
        if (e.target.files && e.target.files[0]) {
          handleFile(e.target.files[0]);
        }
      };

      const triggerFileInput = () => {
        if (fileInputRef.current) {
          fileInputRef.current.click();
        }
      };

      const handleFile = async (file) => {
        if (!file) return;
        setFileName(file.name);
        setLoading(true);
        const reader = new FileReader();
        reader.onload = async (e) => {
          try {
            const data = new Uint8Array(e.target.result);
            const workbook = XLSX.read(data, { type: 'array' });
            const firstSheetName = workbook.SheetNames[0];
            const worksheet = workbook.Sheets[firstSheetName];
            const rows = XLSX.utils.sheet_to_json(worksheet, { header: 1, defval: '', blankrows: true });

            // Extract date from Row 2
            let detectedDate = selectedDate;
            const b2Val = rows[1] ? rows[1][0] : '';
            const match = b2Val && b2Val.toString().match(/(\d{2})\/(\d{2})\/(\d{4})/);
            if (match) {
              detectedDate = `${match[3]}-${match[2]}-${match[1]}`;
              setSelectedDate(detectedDate);
            }

            // Fetch estimasi for the detected date immediately to make sure it matches
            const sessionRaw = sessionStorage.getItem("agripam_session");
            const session = sessionRaw ? JSON.parse(sessionRaw) : null;
            const token = session ? session.token : "";
            const estRes = await fetch(`/api/estimasi?action=getEstimasi&tanggal=${detectedDate}&region=ALL&token=${token}&_t=${Date.now()}`);
            const estJson = await estRes.json();
            const activeEstimasi = estJson.success ? (estJson.allEstimasi || {}) : {};
            setDbEstimasi(normalizeEstimasiData(activeEstimasi));

            // Compute LHP totals
            const totals = {};
            ALL_REGIONS.forEach(reg => {
              totals[reg] = { panen: 0, kirim: 0 };
            });

            // Mendeteksi header kolom secara dinamis (mengabaikan tanda baca, spasi, dan satuan)
            let headerRowIndex = 5; // Default baris ke-6 (0-indexed 5)
            for (let i = 0; i < Math.min(rows.length, 10); i++) {
              if (rows[i]) {
                const hasKgPanen = rows[i].some(cell => {
                  if (!cell) return false;
                  const valClean = cell.toString().toLowerCase().replace(/[^a-z0-9]/g, '');
                  return valClean.includes('kgpanen') || valClean.includes('panenkg');
                });
                if (hasKgPanen) {
                  headerRowIndex = i;
                  break;
                }
              }
            }
            const headerRow = rows[headerRowIndex] || [];
            let colWilayah = 1; // Default Column B (Wilayah)
            let colPanen = 11;  // Default Column L (Kg Panen)
            let colKirim = 7;   // Default Column H (Kirim)
            headerRow.forEach((cell, idx) => {
              if (!cell) return;
              const valClean = cell.toString().toLowerCase().replace(/[^a-z0-9]/g, '');
              if (valClean.includes('wilayah')) {
                colWilayah = idx;
              } else if (valClean.includes('kgpanen') || valClean.includes('panenkg')) {
                colPanen = idx;
              }
            });

            // Cari kolom Real untuk Kirim (seharusnya berada di colPanen - 5)
            let foundKirim = false;
            const offsetKirim = colPanen - 5;
            if (offsetKirim >= 0 && headerRow[offsetKirim]) {
              const valClean = headerRow[offsetKirim].toString().toLowerCase().replace(/[^a-z0-9]/g, '');
              if (valClean.includes('real')) {
                colKirim = offsetKirim;
                foundKirim = true;
              }
            }

            if (!foundKirim) {
              headerRow.forEach((cell, idx) => {
                if (!cell) return;
                const valClean = cell.toString().toLowerCase().replace(/[^a-z0-9]/g, '');
                if (valClean.includes('real') && idx >= 6 && !foundKirim) {
                  colKirim = idx;
                  foundKirim = true;
                }
              });
            }

            for (let r = headerRowIndex + 1; r < rows.length; r++) {
              const row = rows[r];
              if (!row || !Array.isArray(row)) continue;
              const rawReg = row[colWilayah];
              if (!rawReg) continue;
              const matchedReg = findRegionMatch(rawReg);
              if (matchedReg) {
                let valPanen = row[colPanen];
                let valKirim = row[colKirim];

                if (typeof valPanen === 'string') valPanen = valPanen.replace(/[^\d.,]/g, '').replace(/,/g, '');
                if (typeof valKirim === 'string') valKirim = valKirim.replace(/[^\d.,]/g, '').replace(/,/g, '');

                const numPanen = valPanen !== null && valPanen !== undefined && valPanen !== '' ? parseFloat(valPanen) : 0;
                const numKirim = valKirim !== null && valKirim !== undefined && valKirim !== '' ? parseFloat(valKirim) : 0;

                if (!isNaN(numPanen)) totals[matchedReg].panen += (numPanen / 1000);
                if (!isNaN(numKirim)) totals[matchedReg].kirim += (numKirim / 1000);
              }
            }

            setRegionTotals(totals);
          } catch (err) {
            console.error("Gagal membaca Excel LHP:", err);
            alert("Gagal memproses file Excel LHP: " + err.message);
          } finally {
            setLoading(false);
          }
        };
        reader.readAsArrayBuffer(file);
      };

      const handleRemarkChange = (label, val) => {
        setCustomRemarks(prev => ({
          ...prev,
          [label]: val
        }));
      };

      // Process rows to display
      const processedRows = RENCANA_REALISASI_ROWS.map(rowConfig => {
        if (rowConfig.type === 'detail') {
          const officialReg = rowConfig.regionKey;
          const estRow = dbEstimasi[officialReg];
          const rencanaPanen = estRow ? (parseFloat(estRow.estPanen) || 0) / 1000 : 0;

          let tbsPanen = regionTotals && regionTotals[rowConfig.regionKey] ? (regionTotals[rowConfig.regionKey].panen || 0) : 0;
          let tbsKirim = regionTotals && regionTotals[rowConfig.regionKey] ? (regionTotals[rowConfig.regionKey].kirim || 0) : 0;

          const pctPanenVsRenc = rencanaPanen > 0 ? (tbsPanen / rencanaPanen) * 100 : 0;
          const pctKirimVsRenc = rencanaPanen > 0 ? (tbsKirim / rencanaPanen) * 100 : 0;

          const dynamicTarget = (rowConfig.excelKey && targetChallengeData[rowConfig.excelKey] !== undefined)
            ? targetChallengeData[rowConfig.excelKey]
            : rowConfig.target;
          const pctKirimVsTarget = dynamicTarget > 0 ? (tbsKirim / dynamicTarget) * 100 : 0;

          return {
            ...rowConfig,
            target: dynamicTarget,
            rencanaPanen,
            tbsPanen,
            tbsKirim,
            pctPanenVsRenc,
            pctKirimVsRenc,
            pctKirimVsTarget
          };
        }
        return rowConfig;
      });

      // Compute subtotals
      processedRows.forEach(row => {
        if (row.type === 'subtotal') {
          let luas = 0;
          let target = 0;
          let rencanaPanen = 0;
          let tbsPanen = 0;
          let tbsKirim = 0;

          row.children.forEach(childLabel => {
            const childRow = processedRows.find(r => r.type === 'detail' && (r.label === childLabel || r.regionKey === childLabel));
            if (childRow) {
              luas += childRow.luas || 0;
              target += childRow.target || 0;
              rencanaPanen += childRow.rencanaPanen || 0;
              tbsPanen += childRow.tbsPanen || 0;
              tbsKirim += childRow.tbsKirim || 0;
            }
          });

          row.luas = luas;
          row.target = target;
          row.rencanaPanen = rencanaPanen;
          row.tbsPanen = tbsPanen;
          row.tbsKirim = tbsKirim;
          row.pctPanenVsRenc = rencanaPanen > 0 ? (tbsPanen / rencanaPanen) * 100 : 0;
          row.pctKirimVsRenc = rencanaPanen > 0 ? (tbsKirim / rencanaPanen) * 100 : 0;
          row.pctKirimVsTarget = target > 0 ? (tbsKirim / target) * 100 : 0;
        }
      });

      // Compute total Jumlah
      const totalRow = processedRows.find(r => r.type === 'total');
      if (totalRow) {
        let luas = 0;
        let target = 0;
        let rencanaPanen = 0;
        let tbsPanen = 0;
        let tbsKirim = 0;

        processedRows.forEach(row => {
          if (row.type === 'subtotal') {
            luas += row.luas || 0;
            target += row.target || 0;
            rencanaPanen += row.rencanaPanen || 0;
            tbsPanen += row.tbsPanen || 0;
            tbsKirim += row.tbsKirim || 0;
          }
        });

        totalRow.luas = luas; // Total otomatis dari subtotal
        totalRow.target = target;
        totalRow.rencanaPanen = rencanaPanen;
        totalRow.tbsPanen = tbsPanen;
        totalRow.tbsKirim = tbsKirim;
        totalRow.pctPanenVsRenc = rencanaPanen > 0 ? (tbsPanen / rencanaPanen) * 100 : 0;
        totalRow.pctKirimVsRenc = rencanaPanen > 0 ? (tbsKirim / rencanaPanen) * 100 : 0;
        totalRow.pctKirimVsTarget = target > 0 ? (tbsKirim / target) * 100 : 0;
      }

      const getConditionalStyle = (val) => {
        if (val === undefined || val === null || isNaN(val)) return {};
        const num = parseFloat(val);
        if (num > 100) {
          return { backgroundColor: '#00cc00', color: '#000000', fontWeight: 'bold' };
        } else if (num >= 90) {
          return { backgroundColor: '#ffff00', color: '#000000', fontWeight: 'bold' };
        } else {
          return { backgroundColor: '#ff0000', color: '#ffffff', fontWeight: 'bold' };
        }
      };

      const formatDateSlash = (dateStr) => {
        if (!dateStr) return '';
        const parts = dateStr.split('-');
        if (parts.length !== 3) return dateStr;
        return `${parts[2]}/${parts[1]}/${parts[0]}`;
      };

      const formatDateIndo = (dateStr) => {
        if (!dateStr) return '';
        const months = ["Januari", "Februari", "Maret", "April", "Mei", "Juni", "Juli", "Agustus", "September", "Oktober", "November", "Desember"];
        const parts = dateStr.split('-');
        if (parts.length !== 3) return dateStr;
        return `${parseInt(parts[2], 10)} ${months[parseInt(parts[1], 10) - 1]} ${parts[0]}`;
      };

      const handleExportPdf = () => {
        const element = document.getElementById("rencana-realisasi-print-container");
        if (!element) return;

        const opt = {
          margin: [5, 5, 5, 5],
          filename: `Rencana & Realisasi Panen  ${selectedDate}.pdf`,
          image: { type: 'jpeg', quality: 0.98 },
          html2canvas: { scale: 2.5, useCORS: true, letterRendering: true },
          jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
        };

        const btn = document.getElementById("btn-pdf-export");
        const originalText = btn.innerHTML;
        btn.innerHTML = `<span class="inline-block animate-spin mr-1">⚙️</span> Generating PDF...`;
        btn.disabled = true;

        html2pdf().from(element).set(opt).save().then(() => {

    // TK PANEN VIEW (Realisasi Tenaga Kerja Panen Kebun)

    function ExecutiveIntelligenceHighlight({ kebunData, cutOffField = 'tk_oktober', cutOffLabel = 'Oktober' }) {
      if (!kebunData || kebunData.length === 0) return null;

      let totalReq = 0;
      let totalAvail = 0;
      const regionStats = {};

      kebunData.forEach(k => {
        const reg = k.region || 'Unknown';
        if (!regionStats[reg]) {
          regionStats[reg] = { req: 0, avail: 0 };
        }
        const req = parseFloat(k.req_tk) || 0;
        const avail = parseFloat(k[cutOffField]) || 0;
        regionStats[reg].req += req;
        regionStats[reg].avail += avail;
        totalReq += req;
        totalAvail += avail;
      });

      const kekurangTK = Math.max(0, totalReq - totalAvail);

      const uniqueRegions = Object.keys(regionStats).filter(r => r !== 'Unknown');
      const isSingleRegion = uniqueRegions.length === 1;
      const singleRegionName = isSingleRegion ? uniqueRegions[0] : '';

      let detailsElements = null;

      if (isSingleRegion) {
        const deficitKebuns = kebunData
          .map(k => {
            const req = parseFloat(k.req_tk) || 0;
            const avail = parseFloat(k[cutOffField]) || 0;
            const deficit = Math.max(0, req - avail);
            return { name: k.nama_kebun, deficit };
          })
          .filter(k => k.deficit > 0)
          .sort((a, b) => b.deficit - a.deficit);

        detailsElements = deficitKebuns.length > 0 ? (
          deficitKebuns.map((k, i, arr) => (
            <span key={k.name}>
              <strong className="text-[#B8860B] font-bold drop-shadow-[0_0_5px_rgba(184,134,11,0.5)]">{k.name}</strong> Kekurangan <strong className="text-[#B8860B] font-bold drop-shadow-[0_0_5px_rgba(184,134,11,0.5)]">{Number(k.deficit).toLocaleString('id-ID')}</strong> Orang{i < arr.length - 1 ? ', ' : '.'}
            </span>
          ))
        ) : (
          <span className="text-emerald-600 dark:text-emerald-400 font-bold">
            Seluruh kebun di Region {singleRegionName} telah mencukupi kebutuhan tenaga panen cut-off {cutOffLabel}.
          </span>
        );
      } else {
        const regions = uniqueRegions
          .map(reg => {
            const req = regionStats[reg].req;
            const avail = regionStats[reg].avail;
            const deficit = Math.max(0, req - avail);
            return { name: reg, req, avail, deficit };
          })
          .filter(r => r.deficit > 0)
          .sort((a, b) => b.deficit - a.deficit);

        detailsElements = regions.length > 0 ? (
          regions.map((r, i, arr) => (
            <span key={r.name}>
              <strong className="text-[#B8860B] font-bold drop-shadow-[0_0_5px_rgba(184,134,11,0.5)]">{r.name}</strong> Kekurangan <strong className="text-[#B8860B] font-bold drop-shadow-[0_0_5px_rgba(184,134,11,0.5)]">{Number(r.deficit).toLocaleString('id-ID')}</strong> Orang{i < arr.length - 1 ? ', ' : '.'}
            </span>
          ))
        ) : (
          <span className="text-emerald-600 dark:text-emerald-400 font-bold">
            Seluruh regional telah mencukupi kebutuhan tenaga panen cut-off {cutOffLabel}.
          </span>
        );
      }

      return (
        <div className="relative rounded-2xl mb-6 overflow-hidden border border-slate-300 dark:border-slate-700 shadow-md">
          {/* Inner dark gradient with tech-like radial overlay */}
          <div className="absolute inset-0 bg-[#d9d9d9] dark:bg-[#1E1E1E] z-0"></div>
          <div className="absolute inset-0 opacity-10 bg-[radial-gradient(ellipse_at_top_right,_var(--tw-gradient-stops))] from-blue-400 via-transparent to-transparent z-0"></div>

          <div className="relative z-10 p-5 md:p-6 flex flex-col md:flex-row gap-6 font-['Arial']">
            {/* Left Column */}
            <div className="md:w-1/3 flex flex-col justify-center border-b md:border-b-0 md:border-r border-slate-300 dark:border-slate-700 pb-6 md:pb-0 md:pr-6">
              <div className="flex items-center gap-4 mb-4">
                <div className="flex-shrink-0 flex items-center justify-center w-14 h-14 rounded-xl bg-gradient-to-br from-[#d4af37] via-[#aa8022] to-[#8b6508] shadow-[0_0_15px_rgba(212,175,55,0.4)] border border-[#fadd82]/50">
                  <img src="Light-Bulb--Streamline-Ultimate.png" alt="Idea" width="28" height="28" className="object-contain" />
                </div>
                <h2 className="text-xl md:text-2xl font-bold text-slate-900 dark:text-white leading-tight tracking-wide drop-shadow-sm">
                  Executive Intelligence Highlight
                </h2>
              </div>
              <p className="text-sm font-bold text-slate-800 dark:text-slate-200 leading-relaxed pr-2">
                {isSingleRegion ? (
                  <>
                    Berdasarkan data ketersediaan TK Panen cut-off <strong className="text-[#B8860B] font-bold drop-shadow-[0_0_5px_rgba(184,134,11,0.5)]">{cutOffLabel}</strong>, Region <strong className="text-[#B8860B] font-bold drop-shadow-[0_0_5px_rgba(184,134,11,0.5)]">{singleRegionName}</strong> mengalami Kekurangan tenaga Panen <strong className="text-[#B8860B] font-bold drop-shadow-[0_0_5px_rgba(184,134,11,0.5)]">{Number(kekurangTK).toLocaleString('id-ID')}</strong> Orang.
                  </>
                ) : (
                  <>
                    Berdasarkan data ketersediaan TK Panen cut-off <strong className="text-[#B8860B] font-bold drop-shadow-[0_0_5px_rgba(184,134,11,0.5)]">{cutOffLabel}</strong>, dengan Kekurangan tenaga Panen <strong className="text-[#B8860B] font-bold drop-shadow-[0_0_5px_rgba(184,134,11,0.5)]">{Number(kekurangTK).toLocaleString('id-ID')}</strong> Orang.
                  </>
                )}
              </p>
            </div>

            {/* Right Column */}
            <div className="md:w-2/3 flex items-center">
              <p className="text-xs md:text-[13px] font-bold leading-[1.8] text-slate-800 dark:text-slate-200 text-justify">
                {detailsElements}
              </p>
            </div>
          </div>
        </div>
      );
    }

    function MonitorTKModal({ isOpen, onClose, kebunData }) {
      if (!isOpen) return null;

      let sumLuasan = 0;
      let sumKebutuhan = 0;
      let sumMei = 0, sumJuni = 0, sumJuli = 0, sumAgs = 0, sumSept = 0, sumOkt = 0;
      let sumRencanaJuli = 0, sumRencanaAgs = 0, sumRencanaSept = 0, sumRencanaOkt = 0, sumRencanaNov = 0;

      // Grouping data
      const grouped = {};
      (kebunData || []).forEach(item => {
        let region = item.region || '-';
        if (region.toLowerCase() === 'papua selatan') return;
        if (region === 'Sumatera Utara 2 Ex Torganda' || region === 'Sumut 2 Ex Torganda') {
          region = 'Sumut 2';
        }
        let cro = item.cro || '-';
        if (cro === 'CRO 1') cro = 'CRO I';
        const key = `${cro}_${region}`;
        if (!grouped[key]) {
          grouped[key] = {
            cro: cro,
            region: region,
            luasan: 0,
            req_tk: 0,
            tk_mei: 0,
            tk_juni: 0,
            tk_juli: 0,
            tk_agustus: 0,
            tk_september: 0,
            tk_oktober: 0,
            target_juli: 0,
            target_agustus: 0,
            target_september: 0,
            target_oktober: 0,
            target_november: 0
          };
        }
        grouped[key].luasan += parseFloat(item.luasan) || 0;
        grouped[key].req_tk += parseInt(item.req_tk, 10) || 0;
        grouped[key].tk_mei += parseInt(item.tk_mei, 10) || 0;
        grouped[key].tk_juni += parseInt(item.tk_juni, 10) || 0;
        grouped[key].tk_juli += parseInt(item.tk_juli, 10) || 0;
        grouped[key].tk_agustus += parseInt(item.tk_agustus, 10) || 0;
        grouped[key].tk_september += parseInt(item.tk_september, 10) || 0;
        grouped[key].tk_oktober += parseInt(item.tk_oktober, 10) || 0;
        grouped[key].target_juli += parseInt(item.target_juli, 10) || 0;
        grouped[key].target_agustus += parseInt(item.target_agustus, 10) || 0;
        grouped[key].target_september += parseInt(item.target_september, 10) || 0;
        grouped[key].target_oktober += parseInt(item.target_oktober, 10) || 0;
        grouped[key].target_november += parseInt(item.target_november, 10) || 0;
      });

      const romanToInt = (str) => {
        const romanMap = { I: 1, V: 5, X: 10, L: 50, C: 100 };
        let num = 0;
        for (let i = 0; i < str.length; i++) {
          if (i > 0 && romanMap[str[i]] > romanMap[str[i - 1]]) {
            num += romanMap[str[i]] - 2 * romanMap[str[i - 1]];
          } else {
            num += romanMap[str[i]];
          }
        }
        return num;
      };

      const intToRoman = (num) => {
        const romanMap = { M: 1000, CM: 900, D: 500, CD: 400, C: 100, XC: 90, L: 50, XL: 40, X: 10, IX: 9, V: 5, IV: 4, I: 1 };
        let str = '';
        for (let i of Object.keys(romanMap)) {
          let q = Math.floor(num / romanMap[i]);
          num -= q * romanMap[i];
          str += i.repeat(q);
        }
        return str;
      };

      const parseCro = (croStr) => {
        const parts = croStr.trim().split(' ');
        if (parts.length > 1) {
          const lastPart = parts[parts.length - 1].toUpperCase();
          if (/^[IVXLC]+$/.test(lastPart)) {
            return romanToInt(lastPart);
          }
          const num = parseInt(lastPart, 10);
          if (!isNaN(num)) return num;
        }
        return 999;
      };

      const formatCroToRoman = (croStr) => {
        const parts = croStr.trim().split(' ');
        if (parts.length > 1) {
          const lastPart = parts[parts.length - 1];
          const num = parseInt(lastPart, 10);
          if (!isNaN(num)) {
            parts[parts.length - 1] = intToRoman(num);
            return parts.join(' ');
          }
        }
        return croStr;
      };

      const aggregatedData = Object.values(grouped).sort((a, b) => {
        if (a.cro !== b.cro) {
          const aVal = parseCro(a.cro);
          const bVal = parseCro(b.cro);
          if (aVal !== 999 && bVal !== 999 && aVal !== bVal) {
            return aVal - bVal;
          }
          return a.cro.localeCompare(b.cro, undefined, { numeric: true, sensitivity: 'base' });
        }
        return a.region.localeCompare(b.region, undefined, { numeric: true, sensitivity: 'base' });
      });

      const croCounts = {};
      aggregatedData.forEach(item => {
        const romanCro = formatCroToRoman(item.cro);
        croCounts[romanCro] = (croCounts[romanCro] || 0) + 1;
      });
      const formatTrendBadge = (current, previous) => {

    function TKPanenView({ userSession }) {
      const [kebunData, setKebunData] = useState([]);
      const [isMonitorModalOpen, setIsMonitorModalOpen] = useState(false);
      const [summary, setSummary] = useState({});
      const [loading, setLoading] = useState(true);
      const sessionRaw = sessionStorage.getItem("agripam_session");
      const session = sessionRaw ? JSON.parse(sessionRaw) : null;
      const userRegion = (session && session.region) ? session.region : 'ALL';
      const isAdmin = userRegion.toUpperCase() === 'ADMIN';

      const defaultCro = React.useMemo(() => {
        if (isAdmin) return 'CRO 1';
        const match = (kebunData || []).find(k => k.region && k.region.toLowerCase() === userRegion.toLowerCase());
        return match && match.cro ? match.cro : 'CRO 1';
      }, [kebunData, userRegion, isAdmin]);

      const [selectedRegion, setSelectedRegion] = useState(isAdmin ? 'ALL' : userRegion);
      const CUT_OFF_MONTHS = [
        { key: 'tk_mei', label: 'Mei' },
        { key: 'tk_juni', label: 'Juni' },
        { key: 'tk_juli', label: 'Juli' },
        { key: 'tk_agustus', label: 'Agustus' },
        { key: 'tk_september', label: 'September' },
        { key: 'tk_oktober', label: 'Oktober' }
      ];
      const [activeCutOffMonth, setActiveCutOffMonth] = useState('tk_oktober');
      const [searchQuery, setSearchQuery] = useState('');
      const [edits, setEdits] = useState({});
      const [saving, setSaving] = useState(false);
      const [toastMsg, setToastMsg] = useState(null);
      const [activeEditKebun, setActiveEditKebun] = useState(null);
      const [isAddModalOpen, setIsAddModalOpen] = useState(false);
      const [deleteConfirm, setDeleteConfirm] = useState(null);

      useEffect(() => {
        if (toastMsg) {
          const timer = setTimeout(() => setToastMsg(null), 4000);
          return () => clearTimeout(timer);
        }
      }, [toastMsg]);

      const handleDeleteKebun = (id, namaKebun) => {
        setDeleteConfirm({ id, name: namaKebun });
      };

      const handleAddKebun = async (payload) => {
        try {
          const res = await fetch(`/api/kebunTK?action=addKebun&region=${encodeURIComponent(userRegion)}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });
          const json = await res.json();
          if (json.success) {
            setToastMsg({ type: 'success', text: `Kebun '${payload.nama_kebun}' berhasil ditambahkan!` });
            fetchKebunData(selectedRegion);
            setIsAddModalOpen(false);
          } else {
            setToastMsg({ type: 'error', text: `Gagal menambahkan: ${json.message}` });
          }
        } catch (err) {
          console.error("Error adding kebun:", err);
          setToastMsg({ type: 'error', text: 'Terjadi kesalahan saat menambahkan kebun.' });
        }
      };

      const fetchKebunData = async (reg) => {
        setLoading(true);
        try {
          const reqReg = isAdmin ? (reg || 'ALL') : userRegion;
          const res = await fetch(`/api/kebunTK?action=getKebun&region=${encodeURIComponent(reqReg)}&_t=${Date.now()}`);
          const json = await res.json();
          if (json.success) {
            setKebunData(json.data || []);
            setSummary(json.summary || {});
          } else {
            setKebunData([]);
          }
        } catch (err) {
          console.error("Error fetching kebun TK data:", err);
          setKebunData([]);
        } finally {
          setLoading(false);
        }
      };

      useEffect(() => {
        fetchKebunData(selectedRegion);
      }, [selectedRegion]);

      const handleSaveEdits = async (editPayload) => {
        setSaving(true);

        // Optimistic UI Update: Langsung ubah state tabel
        setKebunData(prevData => {
          return prevData.map(item => {
            const edited = editPayload.find(e => e.id === item.id);
            if (edited) {
              return {
                ...item,
                ...edited
              };
            }
            return item;
          });
        });

        try {
          const res = await fetch('/api/kebunTK', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              action: 'updateTK',
              region: userRegion,
              token: userSession ? userSession.token : '',
              edits: editPayload
            })
          });

          const json = await res.json();
          if (json.success) {
            setToastMsg({ type: 'success', text: json.message || 'Data TK Panen berhasil disimpan!' });
            setEdits({});
            setActiveEditKebun(null);
            // Fetch data di background untuk memastikan sinkronisasi
            fetchKebunData(selectedRegion);
          } else {
            setToastMsg({ type: 'error', text: json.message || 'Gagal menyimpan data TK Panen.' });
          }
        } catch (err) {
          console.error("Error saving TK data:", err);
          setToastMsg({ type: 'error', text: 'Terjadi kesalahan saat menyimpan data.' });
        } finally {
          setSaving(false);
          setTimeout(() => setToastMsg(null), 4000);

    function App() {
      const [activeNav, setActiveNav] = useState('laporan-jam');
      const [filters, setFilters] = useState({
        cro: 'Semua CRO',
        regional: 'Semua Regional',
        dateMode: 'TUNGGAL',
        tanggal: getTodayWIB(),
        tanggal_akhir: getTodayWIB(),
        _referenceDate: getTodayWIB()
      });
      const [sidebarCollapsed, setSidebarCollapsed] = useState(false);
      const [mobileOpen, setMobileOpen] = useState(false);
      const [realisasiRecords, setRealisasiRecords] = useState([]);
      const [estimasiData, setEstimasiData] = useState({});
      const [kemarinRecords, setKemarinRecords] = useState([]);
      const [loading, setLoading] = useState(false);

      const [theme, setTheme] = useState(localStorage.getItem("agripam_theme") || "light");

      useEffect(() => {
        document.documentElement.setAttribute("data-theme", theme);
        localStorage.setItem("agripam_theme", theme);
      }, [theme]);

      const toggleTheme = () => {
        setTheme(prev => prev === 'dark' ? 'light' : 'dark');
      };

      const getYesterdayDate = (dateStr) => {
        if (!dateStr || dateStr === 'Semua Tanggal') return '';
        const parts = dateStr.split('-');
        if (parts.length !== 3) return '';
        const d = new Date(parseInt(parts[0], 10), parseInt(parts[1], 10) - 1, parseInt(parts[2], 10));
        d.setDate(d.getDate() - 1);
        const yyyy = d.getFullYear();
        const MM = String(d.getMonth() + 1).padStart(2, '0');
        const dd = String(d.getDate()).padStart(2, '0');
        return `${yyyy}-${MM}-${dd}`;
      };

      // Sync dates when dateMode or _referenceDate changes
      useEffect(() => {
        setFilters(prev => {
          const mode = prev.dateMode || 'TUNGGAL';
          const ref = prev._referenceDate || getTodayWIB();
          let start = ref;
          let end = ref;

          if (mode === 'TUNGGAL') {
            start = ref;
            end = ref;
          } else if (mode === 'SD_BULAN_INI') {
            const d = new Date(ref);
            start = `${d.getFullYear()}-01-01`;
            end = ref;
          } else if (mode === 'SD_HARI_INI') {
            const d = new Date(ref);
            start = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-01`;
            end = ref;
          } else if (mode === 'KUSTOM') {
            start = prev.tanggal;
            end = prev.tanggal_akhir;
          }

          if (prev.tanggal !== start || prev.tanggal_akhir !== end) {
            return { ...prev, tanggal: start, tanggal_akhir: end };
          }
          return prev;
        });
      }, [filters.dateMode, filters._referenceDate]);

      useEffect(() => {
        if (!filters.tanggal || filters.tanggal === 'Semua Tanggal') return;

        let active = true;
        const fetchDashboardData = async () => {
          setLoading(true);
          try {
            const sessionRaw = sessionStorage.getItem("agripam_session");
            const session = sessionRaw ? JSON.parse(sessionRaw) : null;
            const token = session ? session.token : "";

            const yesterday = getYesterdayDate(filters.tanggal);
            const isRange = filters.tanggal !== filters.tanggal_akhir;

            // Prepare API calls
            const promises = [
              fetch(`/api/realisasi?action=getData&tanggal=${filters.tanggal}&tanggal_akhir=${filters.tanggal_akhir || filters.tanggal}&region=ALL&_t=${Date.now()}`),
              fetch(`/api/estimasi?action=getEstimasi&tanggal=${filters.tanggal}&tanggal_akhir=${filters.tanggal_akhir || filters.tanggal}&region=ALL&token=${token}&_t=${Date.now()}`),
            ];

            // Only fetch yesterday's data if NOT in range mode
            if (!isRange) {
              promises.push(fetch(`/api/realisasi?action=getData&tanggal=${yesterday}&region=ALL&_t=${Date.now()}`));
            }

            const results = await Promise.all(promises);
            const realisasiRes = results[0];
            const estimasiRes = results[1];
            const kemarinRes = isRange ? null : results[2];

            const realisasiJson = await realisasiRes.json();
            const estimasiJson = await estimasiRes.json();
            const kemarinJson = kemarinRes ? await kemarinRes.json() : { success: true, allRecords: [] };

            if (active) {
              if (realisasiJson.success) {
                setRealisasiRecords(realisasiJson.allRecords || []);
              } else {
                setRealisasiRecords([]);
              }
              if (estimasiJson.success) {
                setEstimasiData(estimasiJson.allEstimasi || {});
              } else {
                setEstimasiData({});
              }
              if (kemarinJson && kemarinJson.success) {
                setKemarinRecords(kemarinJson.allRecords || []);
              } else {
                setKemarinRecords([]);
              }
            }
          } catch (e) {
            console.error(e);
            if (active) {
              setRealisasiRecords([]);
              setEstimasiData({});
              setKemarinRecords([]);
            }
          } finally {
            if (active) setLoading(false);
          }
        };

        fetchDashboardData();
        return () => { active = false; };
      }, [filters.tanggal, filters.tanggal_akhir]);

      const regionalDetails = computeRegionalDetails(realisasiRecords, estimasiData);

      return (
        <div className="flex h-screen overflow-hidden bg-slate-50">
          {/* Sidebar */}
          <Sidebar
            activeNav={activeNav}
            setActiveNav={setActiveNav}
            collapsed={sidebarCollapsed}
            setCollapsed={setSidebarCollapsed}
            mobileOpen={mobileOpen}
            setMobileOpen={setMobileOpen}
          />

          {/* Main */}
          <main className="flex-1 flex flex-col min-w-0 h-screen overflow-hidden">
            <TopHeader theme={theme} toggleTheme={toggleTheme} onToggleMobile={() => setMobileOpen(prev => !prev)} />

            {/* Scrollable body */}
            <div className="flex-1 overflow-y-auto">
              <div className="flex flex-col gap-5 p-4 sm:p-6 max-w-screen-2xl mx-auto w-full">
                {activeNav === 'tk-panen' ? (
                  <TKPanenView />
                ) : activeNav === 'validasi' ? (
                  <ValidationPanel
                    realisasiRecords={realisasiRecords}
                    regionalDetails={regionalDetails}
                    filters={filters}
                    setFilters={setFilters}
                  />
                ) : activeNav === 'rencana-realisasi' ? (
                  <RencanaRealisasiPanel />
                ) : (
                  <>
                    <FilterBar filters={filters} setFilters={setFilters} />
                    <HourlyChartRow filters={filters} realisasiRecords={realisasiRecords} regionalDetails={regionalDetails} kemarinRecords={kemarinRecords} theme={theme} />
                    <RegionalRow filters={filters} regionalDetails={regionalDetails} />
                    <RealisasiEstimasiChart filters={filters} regionalDetails={regionalDetails} theme={theme} realisasiRecords={realisasiRecords} />
                    <TickerRow realisasiRecords={realisasiRecords} estimasiData={estimasiData} />
                  </>
                )}

                {/* Footer */}
                <footer className="text-center text-[11px] text-slate-400 py-2">
                  PATRIOT- LOYAL - PROFESIONAL
                </footer>
              </div>
            </div>
          </main>
        </div>
      );
    }

    // Mount
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>

</html>
